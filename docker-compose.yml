version: '3.8'

services:
  # Main application
  briefing-agent:
    build: .
    container_name: briefing-agent
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_SEARCH_API_KEY=${TAVILY_SEARCH_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - LOG_LEVEL=INFO
      - ENABLE_CACHE=true
    volumes:
      - ./output:/app/data/output
      - ./logs:/app/logs
    networks:
      - briefing-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis cache layer (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: briefing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - briefing-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL for briefing storage (optional)
  postgres:
    image: postgres:15-alpine
    container_name: briefing-postgres
    environment:
      POSTGRES_USER: briefing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: briefing_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - briefing-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefing"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx reverse proxy (optional for production)
  nginx:
    image: nginx:alpine
    container_name: briefing-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - briefing-network
    depends_on:
      - briefing-agent
    restart: unless-stopped

networks:
  briefing-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
